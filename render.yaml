services:
  # Backend API
  - type: web
    name: salonflow-backend
    env: node
    rootDir: server
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  # Frontend Client
  - type: web
    name: salonflow-frontend
    env: static
    rootDir: client
    buildCommand: pnpm install && pnpm build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
